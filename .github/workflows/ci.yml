name: HRIS CI

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

permission:
  content: read

jobs:
  test:
    name: Unit Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          test -z "$(gofmt -l .)"

      - name: Run unit tests
        run: go test -v ./...

      - name: Build application
        run: go build ./...
