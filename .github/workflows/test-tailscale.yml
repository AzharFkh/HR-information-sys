name: Test Tailscale Connection

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/test-tailscale.yml"

permissions:
  contents: read

jobs:
  test-connection:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
        #   ping: ${{ secrets.SERVER_HOST }}

      - name: Check Tailscale connection
        run: |
          tailscale status
          tailscale ping "${{ secrets.SERVER_HOST }}"

      - name: Test Tailscale connectivity
        env:
            SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          echo "Checking Tailscale status..."
          tailscale status

          echo "Testing Tailscale connectivity..."
          tailscale ping \
            --until-direct=false \
            --c=3 \
            --timeout=5s \
            "$SERVER_HOST"