name: Test Tailscale Connection

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/test-tailscale.yml"

permissions:
  contents: read

jobs:
  test-connection:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Check Tailscale status
        run: |
          tailscale status

      - name: Test SSH port 
        env:
            SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          echo "Testing SSH port 22..."
          nc -zv -w 5 "$SERVER_HOST" 22